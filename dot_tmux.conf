# -- display -------------------------------------------------------------------

set -g base-index 1         # start windows numbering at 1
setw -g pane-base-index 1   # make pane numbering consistent with windows

setw -g automatic-rename on # rename window to reflect current program
set -g renumber-windows on  # renumber windows when a window is closed

set -g set-titles on                        # set terminal title
set -g set-titles-string '#h ❐ #S ● #I #W'

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

# I have 256 colors
set -g default-terminal screen-256color
set -as terminal-features ',foot*:RGB'
set -as terminal-features ',xterm-256color:RGB'
set -g focus-events on

# Eats ram but saves lives
set-option -g history-limit 50000

# Use vi-keys
set-window-option -g mode-keys vi

# Mouse Mode
# is_older="[[ $(tmux -V | cut -d' ' -f2) -lt 2.1 ]] && true || false"
# if-shell "$is_older" "set -g mode-mouse on; set -g mouse-resize-pane on;\
#   set -g mouse-select-pane on; set -g mouse-select-window on" "set -g mouse on"

bind-key m set-option -g mouse on \; display 'Mouse: ON'
bind-key M set-option -g mouse off \; display 'Mouse: OFF'


# Activate inner-most session (when nesting tmux) to send commands
bind a send-prefix

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.1' \; clear-history

# activity
set -g monitor-activity on
set -g visual-activity off

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Set ability to capture on start and restore on exit window data when running an application
setw -g alternate-screen on

# Bar at the bottom
set-option -g status-position bottom
set -g status-keys vi
set -g status-interval 1
set -g status-justify left

# Statusline and pane chrome tuned to match the current tomorrow-night desktop
set -g status-style 'bg=#1d1f21,fg=#c5c8c6'
set -g status-left-length 32
set -g status-right-length 64
set -g status-left '#[fg=#81a2be,bold] #S #[fg=#5c5e5e]|#{?client_prefix,#[fg=#f0c674,bold] prefix #[fg=#5c5e5e]|,}#{?window_zoomed_flag,#[fg=#de935f,bold] zoom #[fg=#5c5e5e]|,}'
set -g status-right '#[fg=#5c5e5e]%Y-%m-%d #[fg=#c5c8c6]%H:%M '
setw -g window-status-format '#[fg=#8e908c] #I:#W '
setw -g window-status-current-format '#[bg=#5f819d,fg=#1d1f21,bold] #I:#W '
setw -g window-status-activity-style 'fg=#de935f,bold'
setw -g window-status-bell-style 'bg=#cc6666,fg=#1d1f21,bold'
set -g pane-border-style 'fg=#5c5e5e'
set -g pane-active-border-style 'fg=#5f819d'
set -g pane-border-status top
set -g pane-border-format '#[fg=#8e908c] #P #[fg=#5c5e5e]| #[fg=#c5c8c6]#{pane_current_command}'
set -g message-style 'bg=#5f819d,fg=#1d1f21,bold'
set -g mode-style 'bg=#f0c674,fg=#1d1f21,bold'
set -g clock-mode-colour '#81a2be'

# Misc
set-option -g repeat-time 0

# Removes ESC delay
set -sg escape-time 0

# Prefix and navigation
unbind C-b
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix

# Colemak-friendly pane movement: HNEI = left/down/up/right
bind h select-pane -L
bind n select-pane -D
bind e select-pane -U
bind i select-pane -R

bind -r H resize-pane -L 5
bind -r N resize-pane -D 5
bind -r E resize-pane -U 5
bind -r I resize-pane -R 5

# Colemak-friendly copy-mode-vi movement.
# Keep the home-row model aligned with sway/tmux pane movement:
#   h n e i = left/down/up/right
# and use the shifted row for viewport movement.
unbind -T copy-mode-vi n
unbind -T copy-mode-vi e
unbind -T copy-mode-vi i
unbind -T copy-mode-vi N
unbind -T copy-mode-vi J
unbind -T copy-mode-vi K
bind -T copy-mode-vi h send-keys -X cursor-left
bind -T copy-mode-vi n send-keys -X cursor-down
bind -T copy-mode-vi e send-keys -X cursor-up
bind -T copy-mode-vi i send-keys -X cursor-right
bind -T copy-mode-vi H send-keys -X top-line
bind -T copy-mode-vi N send-keys -X scroll-down
bind -T copy-mode-vi E send-keys -X scroll-up
bind -T copy-mode-vi I send-keys -X bottom-line
bind -T copy-mode-vi j send-keys -X search-again
bind -T copy-mode-vi J send-keys -X search-reverse

# Choosers and explicit restore controls
bind w choose-tree -Zw
bind G display-popup -E -w 85% -h 80% 'tmux choose-tree -Zw'
bind P display-popup -E -d '#{pane_current_path}' -w 85% -h 80%
bind s choose-tree -Zs
bind Space choose-tree -Zw
bind / command-prompt -p "find window" "find-window '%%'"
bind Enter copy-mode
bind r source-file ~/.tmux.conf \; display-message 'tmux reloaded'
bind S run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'
bind R run-shell '~/.local/bin/rg-tmux-role restore'
bind u display-popup -E -w 80% -h 70% 'tmux choose-buffer -Z'

# Window flow after reclaiming prefix+n for pane-down
bind o next-window
bind p previous-window
bind Tab last-window
bind t new-window -c '#{pane_current_path}'

# List of plugins
set -g @tpm_plugins '                     \
    tmux-plugins/tpm                      \
    tmux-plugins/tmux-sensible            \
    tmux-plugins/tmux-yank                \
    tmux-plugins/tmux-pain-control        \
    tmux-plugins/tmux-open                \
    tmux-plugins/tmux-prefix-highlight    \
    tmux-plugins/tmux-sessionist          \
    tmux-plugins/tmux-resurrect           \
    tmux-plugins/tmux-continuum           \
'
    # fcsonline/tmux-thumbs                 \

# Plugin Configuration
# set -g @thumbs-alphabet colemak

# Optional
#     tmux-plugins/tmux-cpu                 \
#     tmux-plugins/tmux-battery             \

# Restore
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Initialize TMUX plugin manager [ALWAYS THE LAST COMMAND]
# Keep source-file fast and quiet; plugin installation is manual or first-run.
run '~/.tmux/plugins/tpm/tpm'
