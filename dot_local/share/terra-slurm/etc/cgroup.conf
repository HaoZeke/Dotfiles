# Isolate jobs — constrain CPU/memory; reduce free-for-all load/heating
CgroupPlugin=cgroup/v2
ConstrainCores=yes
ConstrainRAMSpace=yes
ConstrainSwapSpace=yes
# Swap is zram. With no allowance a job one page over its --mem is killed;
# 10% of its request may go to zram, so a small overshoot slows the job
# instead of killing it.
AllowedSwapSpace=10
ConstrainDevices=yes
