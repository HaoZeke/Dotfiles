# /etc/systemd/system/user.slice.d/50-terra-memory.conf
# Work outside Slurm (ssh sessions, user services) is bounded, so a stray
# build or test run is throttled and then killed inside user.slice instead
# of driving the node into a global OOM that picks Slurm jobs as victims.
# Heavy work belongs in sbatch/srun, where it gets its own --mem.
[Slice]
MemoryHigh=18G
MemoryMax=20G
