# Single-node Slurm on Terra (rgam5terra) — load/heat control via scheduling + GRES
# Installed to /etc/slurm/slurm.conf by apply-terra-slurm.sh (sudo; run in tsetup)
ClusterName=terra
SlurmctldHost=rgam5terra
MpiDefault=none
ProctrackType=proctrack/linuxproc
ReturnToService=2
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmUser=slurm
SlurmdUser=root
MinJobAge=30
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
TaskPlugin=task/affinity,task/cgroup
PropagateResourceLimitsExcept=MEMLOCK
AccountingStorageType=accounting_storage/none
JobCompType=jobcomp/none
# Enforce hygiene: jobs need explicit resources; default time/mem prevent runaway heat
DefMemPerCPU=1024
MaxMemPerCPU=65536
InactiveLimit=0
KillWait=30
Waittime=0
# Partitions
PartitionName=local Nodes=rgam5terra Default=YES MaxTime=7-00:00:00 State=UP
# Node: set RealMemory/CPUs to match Terra (override via gres/node file if needed)
NodeName=rgam5terra CPUs=32 RealMemory=128000 Gres=gpu:1 State=UNKNOWN
GresTypes=gpu
