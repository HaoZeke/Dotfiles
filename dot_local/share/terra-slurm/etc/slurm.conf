# Single-node Slurm on Terra — Arch package uses /etc/slurm-llnl/slurm.conf
ClusterName=terra
SlurmctldHost=rgam5terra
SlurmctldAddr=127.0.0.1
MpiDefault=none
ProctrackType=proctrack/cgroup
ReturnToService=2
SlurmctldPidFile=/run/slurmctld/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmUser=slurm
SlurmdUser=root
MinJobAge=30
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
TaskPlugin=task/affinity,task/cgroup
PropagateResourceLimitsExcept=MEMLOCK
AccountingStorageType=accounting_storage/none
JobCompType=jobcomp/none
DefMemPerCPU=1024
MaxMemPerCPU=65536
InactiveLimit=0
KillWait=30
Waittime=0
GresTypes=gpu
NodeName=rgam5terra CPUs=32 RealMemory=128000 Gres=gpu:1 State=UNKNOWN

# Two queues mimic a real HPC so job scripts stay portable, and routing all
# heavy work through the scheduler bounds load and heat. cgroup ConstrainDevices
# keeps the GPU visible ONLY to jobs that request it via --gres=gpu.
#   cpu -> CPU-only work (default).            sbatch -p cpu ...
#   gpu -> GPU work, one GPU on the node.      sbatch -p gpu --gres=gpu:1 ...
PartitionName=cpu Nodes=rgam5terra Default=YES MaxTime=3-00:00:00 State=UP OverSubscribe=NO
PartitionName=gpu Nodes=rgam5terra Default=NO  MaxTime=1-00:00:00 State=UP OverSubscribe=NO
