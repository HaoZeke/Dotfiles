# Managed by chezmoi (dot_local/share/rgam5terra/power-00-base.conf)
# Canonical power baseline for rgam5terra (rg.terra): ASRock B650I + Ryzen 9 9950X.
# Consumers: run_onchange_linux_rgam5terra_power.sh.tmpl, rg-terra-power.
# Desktop builder policy: warmer than laptop cool baselines, not reckless.
# Do not reuse laptop TLP confs (no battery, no platform_profile, AMD not Intel).

# amd-pstate-epp: powersave governor is correct with EPP; policy lives in EPP.
CPU_SCALING_GOVERNOR=powersave
# balance_performance: turbo under load for Slurm/builds; parks when idle.
# (power = too soft for a builder; performance = holds clocks high at idle)
CPU_ENERGY_PERF_POLICY=balance_performance
CPU_BOOST=1
# 0 = leave cpuinfo_max (full ~5.75 GHz peak). All-core is PPT-limited by silicon.
# Set e.g. 5500000 only if sustained peaks need a soft trim.
CPU_SCALING_MAX_FREQ=0

# Interactive latency under concurrent compile + serve I/O
NVME_IOSCHED=bfq

# power-profiles-daemon fights hand-managed EPP; keep it off
DISABLE_POWER_PROFILES_DAEMON=1

# TLP is laptop-oriented and not installed here; do not enable.
USE_TLP=0
