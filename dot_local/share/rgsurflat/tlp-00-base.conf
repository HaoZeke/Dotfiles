# Managed by chezmoi (dot_local/share/rgsurflat/tlp-00-base.conf)
# Canonical TLP daily baseline for rgSURFLat (Dell Latitude 7430).
# Consumers: run_onchange_linux_rgsurflat_power.sh.tmpl, rg-tlp-baseline.
# Do not duplicate these keys elsewhere — edit this file only.
# Do not reuse the rgx1gen11 baseline (ThinkPad-specific platform/charge/GPU).
#
# Cool-first daily default: turbo off, EPP=power, max_perf + hard kHz caps.
# Dell platform_profile=cool (choices: cool quiet balanced performance).

# CPU scaling (i7-1255U base 1.7 GHz / turbo 4.7 GHz)
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=power
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_MAX_PERF_ON_AC=65
CPU_MAX_PERF_ON_BAT=55
# Hard kHz ceiling: on HWP hosts max_perf_pct alone often leaves scaling_max
# at cpuinfo_max (4700 MHz here); the explicit frequency cap binds.
CPU_SCALING_MAX_FREQ_ON_AC=1600000
CPU_SCALING_MAX_FREQ_ON_BAT=1400000
CPU_BOOST_ON_AC=0
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=0
CPU_HWP_DYN_BOOST_ON_BAT=0

# Dell ACPI platform profile (not ThinkPad low-power)
PLATFORM_PROFILE_ON_AC=cool
PLATFORM_PROFILE_ON_BAT=cool

# Runtime PM for PCIe devices
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
# Exclude LPSS I2C controllers for Cirque precision touchpad (00:15.0) and
# ELAN900C touchscreen (00:15.1). Without denylist + udev pin, runtime PM
# suspends the controllers and input freezes until an event wakes them.
RUNTIME_PM_DENYLIST="00:15.0 00:15.1"
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# Wi-Fi (NetworkManager owns the interface on this host — do not switch to iwd)
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Disk / USB
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2
SATA_LINKPWR_ON_AC=med_power_with_dipm
SATA_LINKPWR_ON_BAT=min_power
USB_AUTOSUSPEND=1

# Battery longevity: keep near-full desk thresholds already used on this pack.
# Sysfs charge_control_{start,end}_threshold are writable on Latitude 7430.
START_CHARGE_THRESH_BAT0=50
STOP_CHARGE_THRESH_BAT0=90
RESTORE_THRESHOLDS_ON_BAT=1
