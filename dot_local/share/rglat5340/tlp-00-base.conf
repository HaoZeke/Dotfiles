# Managed by chezmoi (dot_local/share/rglat5340/tlp-00-base.conf)
# Canonical TLP daily baseline for rglat5340 (Dell Latitude 5340).
# Consumer: run_onchange_linux_rglat5340_power.sh.tmpl.
# Edit this file only; the script installs it as /etc/tlp.d/00-base.conf.
#
# Personal daily driver, same policy as the rgx1gen11 baseline it replaces:
# full performance on AC, cool-first on battery. Platform and charge keys are
# the Dell ones, not the ThinkPad ones.

# CPU scaling (i5-1345U, 2P+8E, base 1.6 GHz / turbo 4.7 GHz)
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_MAX_PERF_ON_AC=100
CPU_MAX_PERF_ON_BAT=60
# No hard AC ceiling: starving the compositor wedges pointer input.
# On battery the explicit kHz cap binds where max_perf_pct alone does not.
CPU_SCALING_MAX_FREQ_ON_BAT=1400000
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# Dell ACPI platform profile (choices: cool quiet balanced performance)
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=quiet

# Runtime PM for PCIe devices
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
# LPSS I2C 00:15.0 drives the ELAN900C touchscreen and 00:15.1 the ELAN
# 04F3:328E touchpad. Runtime PM on auto suspends them and input freezes;
# 99-rg-touchpad-no-runtime-pm.rules pins power/control=on as well.
RUNTIME_PM_DENYLIST="00:15.0 00:15.1"
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# Wi-Fi (AX211, NetworkManager)
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Disk / USB
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2
USB_AUTOSUSPEND=1

# Battery care: the Dell pack exposes charge_control_{start,end}_threshold.
# 75 -> 90 keeps most of the runtime without holding the cell at 100%.
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=90
RESTORE_THRESHOLDS_ON_BAT=1
