[package]
name = "rg-matrix-notifier"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rg-matrix-notifier"
path = "main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ureq = { version = "3.1", default-features = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
