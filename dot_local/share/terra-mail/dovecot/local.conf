# Terra mail-host — Dovecot 2.4.4 hardened (IMAP only)
# Listen: 127.0.0.1 + 100.119.130.84 ONLY (never 0.0.0.0).
#
# Evolution SSH tunnel (encryption=None) hits Terra as 127.0.0.1:143.
# 2.4: auth_allow_cleartext=no is the disable_plaintext_auth=yes equivalent;
# login_trusted_networks treats 127.0.0.1 as secured so PLAIN works on the tunnel.
# Clients on Tailscale should use 993/TLS or STARTTLS (auth_allow_cleartext=no).

protocols {
  imap = yes
  lmtp = no
  pop3 = no
  submission = no
}

listen = 127.0.0.1,100.119.130.84

ssl = yes
ssl_server_cert_file = /etc/dovecot/ssl-cert.pem
ssl_server_key_file = /etc/dovecot/ssl-key.pem
ssl_min_protocol = TLSv1.2
ssl_cipher_list = EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!aECDH:!EDH-DSS-DES-CBC3-SHA:!KRB5-DES-CBC3-SHA

# disable_plaintext_auth = yes  →  2.4:
auth_allow_cleartext = no
login_trusted_networks = 127.0.0.1
auth_mechanisms = plain login

auth_failure_delay = 2s
mail_max_userip_connections = 20
default_process_limit = 100
default_client_limit = 1000

service auth {
  process_limit = 1
}

service auth-worker {
  process_limit = 20
}

service imap-login {
  process_min_avail = 1
  process_limit = 50
}

service imap {
  process_limit = 50
}

first_valid_uid = 1000
mail_uid = rgoswami
mail_gid = rgoswami
mail_home = /home/rgoswami/.mail

passdb pam {
}

userdb passwd {
}
userdb static {
  fields {
    home = /home/rgoswami/.mail
  }
}

namespace inbox {
  inbox = yes
  prefix =
  separator = /
  mail_driver = maildir
  mail_path = /home/rgoswami/.mail/stores/rog32
  mailbox_list_layout = maildir++
}

namespace ieee {
  prefix = ieee/
  separator = /
  list = yes
  subscriptions = yes
  mail_driver = maildir
  mail_path = /home/rgoswami/.mail/stores/rgoswami.ieee/mail
  mailbox_list_layout = fs
}

