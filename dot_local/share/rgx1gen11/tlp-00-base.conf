# Managed by chezmoi (dot_local/share/rgx1gen11/tlp-00-base.conf)
# Canonical TLP daily baseline for rgx1gen11.
# Consumers: run_onchange_linux_laptop_power.sh.tmpl,
#            rg-linux-rg-cool-sync, rg-linux-rg-userspace-root-setup.
# Do not duplicate these keys elsewhere — edit this file only.
#
# Cool-first daily default: turbo off, EPP=power, max_perf + hard kHz caps.
# Warmer profiles raise policy via rg-x1gen11-profile.

# CPU scaling
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_MAX_PERF_ON_AC=100
CPU_MAX_PERF_ON_BAT=60
# Hard kHz ceiling: on this HWP+no_turbo host max_perf_pct alone does not pull
# scaling_max_freq below cpuinfo_max; the explicit frequency cap does.
# No hard AC ceiling: this host drives a compositor, and starving it
# does not merely feel slow, it wedges the pointer input path.
# Battery keeps its cool-first cap below.
CPU_SCALING_MAX_FREQ_ON_BAT=1000000
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# ThinkPad platform profile
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power

# Runtime PM for PCIe devices
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
# Exclude the Intel LPSS I2C controllers that drive the SYNA8017 precision
# touchpad (00:15.0) and the ELAN touchscreen (00:15.1). With runtime PM left
# on auto, TLP suspends 00:15.0 even on AC and the touchpad intermittently
# freezes until an event wakes it. 99-rg-touchpad-no-runtime-pm.rules then pins
# power/control=on (the i2c_designware default is auto, so denylist alone is not
# enough).
RUNTIME_PM_DENYLIST="00:15.0 00:15.1"
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# Wi-Fi
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Disk
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2
SATA_LINKPWR_ON_AC=med_power_with_dipm
SATA_LINKPWR_ON_BAT=min_power

# USB autosuspend with keyboard/mouse exclusions handled by TLPs defaults.
USB_AUTOSUSPEND=1

# ThinkPad battery care: charge 90 -> 98 on BAT0. This keeps near-full runtime
# without holding the pack at a constant 100%.
START_CHARGE_THRESH_BAT0=90
STOP_CHARGE_THRESH_BAT0=98
RESTORE_THRESHOLDS_ON_BAT=1
