# /etc/sysctl.d/99-buildbot.conf — inotify/watchers + maps for huge monorepos
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 1024
fs.file-max = 9223372036854775807
vm.max_map_count = 2147483642
kernel.pid_max = 4194304
# Swap is zram, so paging idle anon out costs a compression, not a disk
# write. A low value keeps idle anon resident while zram sits empty, and
# reclaim ends in OOM kills.
vm.swappiness = 100
vm.vfs_cache_pressure = 50
