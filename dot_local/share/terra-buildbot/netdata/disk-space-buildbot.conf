# Install to /etc/netdata/health.d/disk-space-buildbot.conf on rgam5terra, then
# `systemctl reload netdata`.
#
# Thresholds are stricter than the stock alarm (80/90 against 90/98) because the
# build root fills faster than a desktop root does.
#
# The percentage comes from the chart's own dimensions via `calc`. A bare
# `lookup ... of used` reports the used dimension in the chart's units, GiB, so
# labelling it `%` compares a terabyte-scale number against 80 and 90 and pins
# the alarm to CRITICAL for as long as the disk holds more than 90 GiB.
#
# `chart labels` keeps the alarm off the pseudo-filesystems, matching stock.

 template: disk_space_usage
       on: disk.space
    class: Utilization
     type: System
component: Disk
chart labels: mount_point=!/dev !/dev/* !/run !/run/* !HarddiskVolume* *
     calc: $used * 100 / ($avail + $used)
    units: %
    every: 10s
     warn: $this > 80
     crit: $this > 90
    delay: down 5m multiplier 1.5 max 1h
  summary: disk ${label:mount_point} space usage
     info: disk ${label:mount_point} is low on space
       to: sysadmin
