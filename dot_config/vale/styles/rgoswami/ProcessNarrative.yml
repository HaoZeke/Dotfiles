extends: existence
message: "'%s' reads like a process log. Describe the failure and fix, not how many attempts it took."
ignorecase: true
level: error
tokens:
  - '\d+ iterations'
  - '\d+ CI iterations'
  - '\d+ CI cycles'
  - 'first attempt.*second attempt'
  - 'took \d+ (tries|attempts|rounds)'
  - 'after \d+ (tries|attempts|rounds|iterations)'
  # Reviewer narrating its own drafting rather than the work under review.
  # The reader wants the finding, not the reviewer's near-misses or revisions.
  - 'something I nearly (wrote|said|sent)'
  - 'I nearly (wrote|said|sent|read it)'
  - 'what I nearly'
  - 'one correction to something'
  - 'correction to (something|what) I'
  - 'I first read (it|this|the)'
  - 'I had (written|said) that'
  - 'I was (heading|about) to (write|say|call)'
  - 'before I (wrote|sent) this'
  - 'in an earlier (draft|version) I'
  - 'my (earlier|first) (reading|draft|version)'
  - 'I would have (told|written|sent)'
  # Crediting a helper that the reader cannot see or check.
  - 'a second (reader|pass|reviewer|opinion)'
  - 'another (reader|agent|model) (confirmed|checked|read)'
  - 'my (co-reader|helper|assistant)'
