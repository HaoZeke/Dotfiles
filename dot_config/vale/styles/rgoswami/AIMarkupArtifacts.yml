extends: existence
message: "'%s' is leaked generation markup or citation scaffolding. Remove it and verify the source manually."
link: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing"
ignorecase: true
nonword: true
level: error
tokens:
  - 'turn\d+(search|view|fetch|source|news|image)\d+'
  - 'contentReference'
  - 'oaicite'
  - 'oai_citation'
  - 'attributableIndex'
  - 'grok_card'
  - ':::writing'
  - '\[citation needed\]'
  - 'utm_source='
  - 'as an ai language model'
  - 'as of my last update'
  - 'as of my last training'
  - 'knowledge cutoff'
