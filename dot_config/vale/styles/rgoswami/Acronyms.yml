extends: conditional
message: "Spell out '%s', if it's unfamiliar to the audience."
link: 'https://developers.google.com/style/abbreviations'
level: suggestion
ignorecase: false
# Ensures that the existence of 'first' implies the existence of 'second'.
# 'second' is the definition; allow lower-case and hyphenated expansions,
# e.g. "foreign function interface (FFI)". The trailing `s?` lets a plural
# definition like "machine-learned interatomic potentials (MLIPs)" count as
# defining the singular acronym. Only acronyms never defined anywhere in the
# document are flagged.
first: '\b([A-Z]{3,5})\b'
second: '(?:\b[A-Za-z][a-z]+[ -]){1,6}\(([A-Z]{3,5})s?\)'
# ... with the exception of these:
exceptions:
  - API
  - ASP
  - CLI
  - CPU
  - CSS
  - CSV
  - DEBUG
  - DOM
  - DPI
  - FAQ
  - GCC
  - GDB
  - GET
  - GPU
  - GTK
