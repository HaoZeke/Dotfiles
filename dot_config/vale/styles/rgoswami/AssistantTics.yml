extends: existence
message: "'%s' is assistant-style scaffolding. State the fact, action, or result directly."
link: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing"
ignorecase: true
nonword: true
level: error
tokens:
  # Cheerleading and acknowledgement openers.
  - '^\s*(sure|certainly|absolutely|definitely|of course)[,!.]'
  - '^\s*(great|excellent|good|nice) (question|catch|call|point)\b'
  - '\bfair point\b'
  - '\byou''?re right\b'
  - '\bthat''?s right\b'
  # Process narration.
  - '\blet me\b'
  - '\bi''?ll (start|begin|check|look|take|walk|go|now|just|first)\b'
  - '\bi''?m going to\b'
  - '\bi can help\b'
  - '\bi can definitely\b'
  - '\bi''?d be happy to\b'
  - '\bhappy to\b'
  - '\bas requested\b'
  - '\bas per your request\b'
  - '\bto answer your question\b'
  - '\bhere''?s (a|an|the|how|what|why)\b'
  - '\bhere are\b'
  - '\bbelow is\b'
  - '\bbelow are\b'
  # Didactic throat-clearing.
  - '\bshort answer\b'
  - '\bthe short version\b'
  - '\bin short\b'
  - '\bin essence\b'
  - '\bput simply\b'
  - '\bsimply put\b'
  - '\bthat being said\b'
  - '\bwith that said\b'
  - '\bthat said\b'
  - '\bplease note\b'
  - '\bkeep in mind\b'
  - '\bbear in mind\b'
  - '\bit''?s worth noting\b'
  - '\bworth noting\b'
  - '\bimportant to note\b'
  - '\bit should be noted\b'
  - '\bno discussion would be complete without\b'
  # Permission and handoff endings.
  - '\blet me know\b'
  - '\bfeel free to\b'
  - '\bif you want\b'
  - '\bif you''?d like\b'
  - '\bif helpful\b'
  - '\bif that helps\b'
  - '\bhope this helps\b'
  - '\bdoes that help\b'
  - '\bsay the word\b'
  - '\bjust say\b'
  - '\bwould you like me to\b'
  - '\bshall i\b'
  # Apology and reassurance boilerplate.
  - '\bi apologize\b'
  - '\bapologies\b'
  - '\bsorry for the confusion\b'
  - '\bthanks for (clarifying|pointing that out)\b'
  - '\bthank you for (clarifying|pointing that out)\b'
  - '\brest assured\b'
  - '\byou''?re all set\b'
  - '\ball set\b'
  - '\bthis should work\b'
  - '\bthat should do it\b'
  # Exploration clichés.
  - '\bdeep dive\b'
  - '\bdive deep\b'
  - '\bdive in\b'
  - '\bdive into\b'
  - '\blet''?s dive\b'
  - '\blet''?s explore\b'
  - '\blet''?s examine\b'
  - '\blet''?s take a look\b'
  - '\bwalk through\b'
  - '\bstep by step\b'
  - '\bstep-by-step\b'
  - '\bwithout further ado\b'
  - '\bbuckle up\b'
  - '\blook no further\b'
  # Generic polish claims.
  - '\bbest practices\b'
  - '\bindustry-standard\b'
  - '\benterprise-grade\b'
  - '\bproduction-ready\b'
  - '\bbattle-tested\b'
  - '\bfuture-proof\b'
  - '\bscalable\b'
  - '\bhigh-level overview\b'
  - '\bhigh level overview\b'
  - '\bhigh-level\b'
  - '\bgranular\b'
  - '\bactionable\b'
  - '\bimpactful\b'
  - '\bmeaningful\b'
  # Generic contrast templates.
  - '\bnot just\b'
  - '\bmore than just\b'
  - '\bnot merely\b'
  - '\bnot only\b'
  - '\bbut also\b'
  # Knowledge-cutoff and model-disclaimer residue.
  - '\bas an ai\b'
  - '\bas a language model\b'
  - '\bi don''?t have access to\b'
  - '\bi can''?t browse\b'
  - '\bmy knowledge cutoff\b'
  - '\bas of my last update\b'
  - '\btraining data\b'
  - '\bup to my last\b'
