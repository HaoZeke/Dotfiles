extends: existence
message: "Highlighter tic ('%s'). Kill it: drop the tic and keep the measured claim. Catalog: https://tools.simonwillison.net/llm-cliche-highlighter"
link: "https://tools.simonwillison.net/llm-cliche-highlighter"
ignorecase: true
nonword: true
level: error
tokens:
  # Rhetorical tics from Willison's highlighter (2026-08-28 catalog).
  # Phrase forms only. Structural runs (echo-triad, stacked questions,
  # sentence anaphora, colon-triples) stay a writing-style manual pass:
  # they are noisy on test lists and scientific notes.
  - "that's the whole point"
  - "that's the whole game"
  - "that's the whole thing"
  - "that's the whole pitch"
  - "this is the whole point"
  - "this is the whole game"
  - "this is the whole thing"
  - "is the entire point"
  - "is the entire game"
  - "is the entire pitch"
  - "is the entire business model"
  - "the entire point is"
  - "the entire game is"
  - "the entire pitch is"
  - "the entire business model is"
  - "here is the whole"
  - "here's the whole"
  - "sit with that"
  - "sit with this"
  - "sit with it"
  - "sit with the discomfort"
  - "you already know the answer"
  - "you already know what to do"
  - "that's not nothing"
  - "that is not nothing"
  - "this is not nothing"
  - "it's not nothing"
  - "worth naming"
  - "the punchline is"
  - "the punchline"
  - "that's the part"
  - "that is the part"
  - "this is the part"
  - "my favorite part of"
  - "my favourite part of"
  - "the only thing that matters"
  - "the only one that matters"
  - "the only benchmark that matters"
  - "take my word for it"
  - "take my word for any of this"
  - "I won't pretend"
  - "I will not pretend"
  - "I'll be honest"
  - "let's be honest"
  - "to be clear"
  - "it turns out that"
  - "hold in your head"
  - "fit in your head"
  - "fits in your head"
  - "batteries included"
  - "it just works"
  - "zero config"
  - "zero-config"
  - "sane defaults"
  - "here's the twist"
  - "here's the catch"
  - "here's the kicker"
  - "here's the rub"
  - "here is the twist"
  - "here is the catch"
  - "long live"
  - "that's why it mattered"
  - "this is why it mattered"
  - "despite these challenges"
  - "despite those challenges"
  - "challenges remain"
  - "faces several challenges"
  - "experts argue"
