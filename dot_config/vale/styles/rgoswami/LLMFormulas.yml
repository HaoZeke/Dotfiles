extends: existence
message: "Model formula ('%s'). Kill it: state the concrete fact, number, or name. Do not keep the hinge, the drumroll, or the fake-depth setup."
link: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing"
ignorecase: true
nonword: true
level: error
tokens:
  # Fake-depth templates (pull-quote lines with no measured content).
  - "in a world where"
  - "in a world of"
  - "the few who win"
  - "you're already behind"
  - "you are already behind"
  - "the real work is"
  - "the real game is"
  - "the real leverage is"
  - "you don't need more"
  - "you do not need more"
  - "it's never been easier"
  - "it has never been easier"
  - "it's never been harder"
  - "it has never been harder"
  - "here's the truth"
  - "here is the truth"
  - "what nobody tells you"
  - "the uncomfortable truth"
  - "gone are the days"
  - "what if I told you"
  - "picture this"
  - "imagine a world"
  - "I'll say it again"
  - "I will say it again"
  - "can we talk about"
  - "that's where it comes in"
  - "that is where it comes in"
  - "and that's the real power"
  - "that's the real power"
  - "beyond mere"
  - "far from being"
  - "far from a"
  # Self-answered rhetorical setup. The question exists only to tee the answer.
  - "the result?"
  - "the catch?"
  - "the kicker?"
  - "sound familiar?"
  - "the takeaway:"
  - "the lesson:"
  - "the moral:"
  - "the upshot:"
  - "the tradeoff:"
  - "the flip side:"
  # Closers that restate nothing.
  - "so the next time"
  - "the possibilities are endless"
  - "the journey is just beginning"
  - "welcome to the new era"
  - "and that's okay"
  - "and that is okay"
  # AISIGNS significance / notability puff.
  - "has been described as"
  - "generated debate about"
  - "prompted broader reflection"
  - "blur boundaries"
  - "blurs the line"
  - "raising philosophical questions"
  - "independent coverage"
  - "active social media presence"
  - "written by a leading expert"
  - "a wide range of"
  - "a diverse range of"
  - "a diverse array of"
  - "a wealth of"
  - "a multitude of"
  - "a treasure trove of"
  # Copula dodge: say is/has.
  - "functions as a"
  - "functions as an"
  - "serves as a"
  - "serves as an"
  - "stands as a"
  - "stands as an"
