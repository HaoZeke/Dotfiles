extends: existence
message: "'%s' is defensive framing. State the fact directly without preemptive disclaimer."
ignorecase: true
level: warning
tokens:
  - does not fail because of deficiency
  - is not because of any
  - is not inherently
  - this is not a criticism
  - to be fair
  - to be clear
  - it should be noted that
  - it must be emphasized
  - one might argue
  - some might say
  - critics might point out
  # copula-negation hedges: state what it IS, not what it isn't
  - is not perfect
  - is not ideal
  - not a real \w+
  - not the early \w+
  # "X, not Y" defensive negation tail (", not the/a/its/because/from ...")
  - \w+, not (the|a|an|its|because|from) \w+
