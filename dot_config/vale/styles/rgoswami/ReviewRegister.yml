extends: existence
message: "'%s' is a review-grading register tell (academic, sports, LinkedIn, or AI-grader). Rewrite plain."
ignorecase: true
level: warning
tokens:
  # Academic: "axis" used for ranking criteria. Bare words banned outright in review prose.
  - axis
  - axes
  - ranking axis
  - ranking axes
  - response-quality axis
  - response quality axis
  - code-quality axis
  - code quality axis
  - overall axis
  - the two axes
  - on this axis
  - on that axis
  - on both axes
  - on these axes
  - on all three axes
  - across the axes
  - across all axes
  # LinkedIn / marketing-speak verbs
  - underclaim
  - underclaiming
  - underclaimed
  - overclaim
  - overclaiming
  - overclaimed
  # Workshop framing
  - the deciding aspect
  - the deciding aspects
  - the deciding factor
  - deciding factors are
  - the deciding line
  - the thing that matters most
  - the things that matter most
  - the aspects that matter
  - what matters most
  # "decisive" grader-adjective: name the requirement, do not label it decisive.
  - decisive
  - decisively
  - decisive miss
  - decisive misses
  - decisive feature
  - decisive features
  # "gate" as editorial verb for a guard (describe the actual condition instead)
  - ungated
  - leaves the call ungated
  - gates the call
  - gate the call
  - leaves it ungated
  # bare "gate"/"gating" for a guard: name the actual condition (checks isatty, only when ...)
  - gate
  - gates
  - gated
  - gating
  # "is what X buys" / "X buys" value-framing
  - buys
  - is what \w[\w ]* buys
  - which is what
  # "is honest" / "honest(ly)" reviewer-praise AIism
  - honest
  - honestly
  - is honest about
  # editorial verdict-flourish closers ("A response whose X ... ranks last")
  - ranks last
  - ranks first
  - ranks below
  - ranks above
  - ranks it last
  - a response whose
  - a response that
  # "ship/ships/shipped" marketing-delivery verb (use includes/adds/provides/has);
  # word-bounded so it never fires inside relationship/membership/township.
  - \bship(s|ped|ping)?\b
  # "on spec" / "feature on spec" filler
  - on spec
  - on-spec
  # "highest/lowest-risk path" and risk-ranking filler
  - the highest-risk path
  - highest-risk path
  - the lowest-risk path
  - the riskiest path
  - highest-risk approach
  # "the exact X the prompt cares about" pattern
  - the prompt cares about
  - exactly what the prompt
  - the exact properties
  - the exact behavior
  - the exact behaviour
  # trailing vagueness
  - and stuff
  - and so on
  - and the like
  - and whatnot
  # meta-commentary that adds nothing (AI throat-clearing)
  - worth stating plainly
  - worth noting
  - it is worth noting
  - it is worth stating
  - and that is worth
  - to be clear
  - it bears noting
  # "clean win" / "keep(s) it from a X win" sportscaster framing
  - a clean win
  - keep it from a clean win
  - keeps it from a clean win
  - kept it from a clean win
  - from a clean win
  - clean sweep
  - clear win
  # Reviewer-confidence boilerplate
  - i am confident in this comparison
  - confident in this comparison
  - based on the model responses' own
  - based on the responses' own
  # AI-grader filler that sounds plausible but says nothing
  - concrete
  - concretely
  - tangible
  - tangibly
  - real, reproducible
  # "which is real" / "that is real" -- empty reassurance filler; state the fact or cut it.
  - which is real
  - that is real
  - which is genuinely
  - this is real
  # AI-tell phrasing: name the scope concretely, not these stock intensifiers.
  - end to end
  - end-to-end
  - weak spot
  - weak spots
  - one weak spot
  # "carry/carries the (real) weight" / "real design weight" load-bearing metaphor:
  # say "decisive", "decides the ranking", or name the requirement plainly.
  - carry the real weight
  - carries the real weight
  - carry the weight
  - carries the weight
  - carr(y|ies) (the )?(real )?weight
  - real design weight
  - the real weight
  # Line-number citation patterns: reviewers describe by name, not by line.
  - on lines \d+
  - on line \d+
  - at lines \d+
  - at line \d+
  - lines \d+ to \d+
  - line \d+ to line \d+
  # "pulls in two directions" / "pulls both ways": metaphor filler.
  # State the two requirements and their trade-off plainly.
  - pulls? in two directions
  - pulls? in different directions
  - pulls? in opposite directions
  - pulls? two ways
  - pulls? both ways
  - pulled in two directions
  - tension between
  # Anthropomorphizing the model's intent: describe what the code DOES (evidence),
  # never what the model "believes/thinks/assumes". That framing flip-flops and is
  # not evidence-based; state the observable mapping/value/condition instead.
  - \bbelieve(s|d)?\b
  - \bbelieving\b
  - \bthinks\b
  - \bis convinced\b
  - \bassume(s|d)?\b
  - \bassuming\b
  - \bintends? to\b
  - \bwants? to\b
  - \btries to\b
  - \btrying to\b
  # "build-verified" reads as an awkward grader tag and, in the public answer,
  # leaks the internal build step. Say it in plain words: "builds", "the build
  # shows", "confirmed by building", or state the covariance behaviour directly.
  - build-verified
  - build verified
  # Essay-register AI tells in starfleet justifications: state the fact plainly,
  # do not narrate or intensify. The submitted answers read declarative and
  # code-dense ("Model B is the best because its scanner ... ; the split is ...").
  # "genuinely/truly correct" intensifies; "land(s) the feature" and "the moment
  # it sees" are essay framing; "buy back", "slip/sail past", "backs this up" are
  # conversational filler. Rewrite to the fact. ("what separates them is" and "the
  # split is" stay; those are the real voice.)
  - \bgenuinely\b
  - \btruly\b
  - lands? the feature
  - the moment it (sees|hits)
  - buys? back
  - slip past
  - sail through
  - backs this up
