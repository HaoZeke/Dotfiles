  # AI-typical "ship/land/come back" framing
  - ship at
  - ships at
  - shipped at
  - comes back as
  - come back as
  - came back as
  - lands at
  - landed at
  # "X side" / "Y side" wraps
  - the c\+\+ side
  - the python side
  - the lua side
  - the model side
  # End-to-end and lock-step corpo
  - end-to-end
  - in lock-step
  - stays in lock-step
  - lock-step
  - hourglass design
  - both halves
  - both legs
  - one leg
  - half the rubric
  - half of the rubric
  # Walk-through / talking-about-the-task tells
  - the trap is
  - the non-obvious bit
  - the non-obvious part
  - the obvious
  - obvious move
  - obvious answer
  - to be fair
  - all of which
  # "real X" / "do real Y" framing the model uses to claim authentic execution
  - do real work
  - does real work
  - did real work
  - real work
  - real C\+\+
  - real Python
  - real code
  - actually run
  - actually ran
  - actually does
  - actually doing
  # Size-as-judgement framing in prose ("604 lines of raw Lua C API",
  # "2200-line diff", "comes in at N lines").  Reviewers count lines
  # themselves; the form-paste field describes what changed, not how big.
  - \d+\s*lines of
  - \d+-line diff
  - \d+-line patch
  - comes in at \d+ lines
  - lands at \d+ lines
  - is \d+ lines
  # "X matters here because..." is a textbook AI explainer transition.
  # Rewrite to state the relationship directly.
  - matters here because
  - matters because
  - is important here because
  - is what matters
  - here is why
  # "Container has everything" filler.  Prompts should list the venv path,
  # env-var names, and the test commands; saying "preconfigured" or "ready
  # to go" adds tokens without adding signal.
  - has everything (pre-?)?installed
  - has everything (it )?needs
  - ships? pre-?configured
  - ships? ready to go
  - is pre-?configured
  - is fully populated
  - fully populated
  - ready to go
  - out of the box
  - set up for you
  - comes (already )?pre-?installed
  - comes pre-?baked
  - pre-?baked
  - pre-?installed and ready
exceptions:
  - 'Holistic Fusion'
