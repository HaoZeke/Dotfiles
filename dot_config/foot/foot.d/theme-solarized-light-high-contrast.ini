# -*- conf -*-
# Solarized light high contrast

[colors-dark]
foreground=002732  # Dark text for high contrast
background=eee8d5  # Light background for a clean look

# Standard ANSI colors
regular0=002b36  # Black
regular1=dc322f  # Red
regular2=859900  # Green
regular3=b58900  # Yellow
regular4=268bd2  # Blue
regular5=d33682  # Magenta
regular6=2aa198  # Cyan
regular7=eee8d5  # White

# Bright ANSI colors for better visibility
bright0=073642  # Bright Black (slightly lighter for visibility)
bright1=cb4b16  # Bright Red
bright2=586e75  # Bright Green
bright3=657b83  # Bright Yellow
bright4=839496  # Bright Blue
bright5=6c71c4  # Bright Magenta
bright6=93a1a1  # Bright Cyan
bright7=fdf6e3  # Bright White

# Dimmed ANSI colors (optional, for when the terminal dims text)
dim0=002b36  # Dimmed Black
dim1=990a1b  # Dimmed Red
dim2=586e75  # Dimmed Green
dim3=655600  # Dimmed Yellow
dim4=445588  # Dimmed Blue
dim5=84426b  # Dimmed Magenta
dim6=406c68  # Dimmed Cyan
dim7=e5e2cc  # Dimmed White

# Selection colors for when text is highlighted
selection-foreground=002732  # Keep the text dark on selection
selection-background=cfcac0  # Light background for selection

# Jump labels for quick navigation (optional)
jump-labels=268bd2 b58900  # Blue text on a yellow background

# Search box colors for match and no-match scenarios
search-box-no-match=dc322f eee8d5  # Red text on light background for no matches
search-box-match=859900 fdf6e3  # Green text on bright white background for matches

# Flash for visual feedback in terminal
flash=7f7f00  # Use a subdued yellow for the flash
flash-alpha=0.5  # Make the flash semi-transparent

# [cursor.color] is deprecated
cursor= eee8d5 002732
