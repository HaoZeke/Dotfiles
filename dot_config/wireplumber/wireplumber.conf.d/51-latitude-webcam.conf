# Latitude 5340 integrated webcam (0c45:6a20) exposes two capture nodes:
# interface 1.0 is the colour camera, interface 1.2 the infrared sensor
# (640x360 GREY, for face login). Both are named "Integrated_Webcam_FHD",
# so a call app can pick the IR one and show a dark grey picture.
# Hide the IR node from applications and name the colour camera clearly.
monitor.v4l2.rules = [
  {
    matches = [
      { node.name = "v4l2_input.pci-0000_00_14.0-usb-0_6_1.2" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "v4l2_input.pci-0000_00_14.0-usb-0_6_1.0" }
    ]
    actions = {
      update-props = {
        node.description = "Integrated Webcam"
        node.nick = "Integrated Webcam"
      }
    }
  }
]
