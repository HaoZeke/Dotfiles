# Unified human-prose gate: lexical (rgoswami vale-YAML) + harper grammar.
# Use with: proseguard --profile prose-human --styles-path ~/.config/vale/styles FILE
name = "prose-human"
description = "Natural non-AI prose gate (style + grammar). Judge off by default."
severity_floor = "warning"
include = ["**/*.md", "**/*.org", "**/*.txt", "**/*.rst"]
exclude = ["**/node_modules/**", "**/.git/**"]
lexical_styles = ["rgoswami", "write-good", "proselint", "Readability"]

# Match house ~/.config/vale/.vale.ini disables for write-good / proselint noise.
lexical_disable = [
  "write-good.Passive",
  "write-good.So",
  "write-good.E-Prime",
  "write-good.ThereIs",
  "write-good.TooWordy",
  "write-good.Illusions",
  "proselint.Annotations",
  "proselint.AnimalLabels",
  "proselint.DenizenLabels",
  "proselint.GenderBias",
  "proselint.GroupTerms",
  "proselint.Spelling",
]


[engines]
lexical = true
leak = false
structure = false
harper = true
judge = false

# Hemingway-style sentence complexity (word-count hard/very-hard) runs in-process
# with defaults hard=14, very_hard=25. McCabe cyclomatic complexity is a code metric;
# for prose use Readability.* (ARI/Flesch/Gunning Fog) + hard sentences.
