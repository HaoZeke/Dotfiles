# Unified human-prose linter: lexical (rgoswami vale-YAML) + harper grammar.
# Use with: proseguard --profile prose-human --styles-path ~/.config/vale/styles FILE
name = "prose-human"
description = "House prose linter: rgoswami tell pack (with kill hints) + kill-stack structure + write-good + proselint + harper."
severity_floor = "warning"
include = ["**/*.md", "**/*.org", "**/*.txt", "**/*.rst"]
exclude = ["**/node_modules/**", "**/.git/**"]
lexical_styles = ["rgoswami", "write-good", "proselint"]

# Match house ~/.config/vale/.vale.ini disables for write-good / proselint noise.
structure_rules = ["rules/structure/model-tells.toml"]

lexical_disable = [
  "write-good.Passive",
  "write-good.So",
  "write-good.E-Prime",
  "write-good.ThereIs",
  "write-good.TooWordy",
  "write-good.Illusions",
  "proselint.Annotations",
  "proselint.AnimalLabels",
  "proselint.DenizenLabels",
  "proselint.GenderBias",
  "proselint.GroupTerms",
  "proselint.Spelling",
]


[engines]
lexical = true
leak = false
structure = true
harper = true
judge = false

# Skip markers (#skip_lint_start/end, code blocks, #+KEYWORD) and
# styles/config/vocabularies/*/accept.txt are applied by the check path.

# Rule-off: <!-- vale Rule = NO --> … YES  or  # proseguard:off Rule
# Inline code/links blanked before engines (span-faithful).

# Flesch / Hemingway word-count grades are not a quality gate for scientific
# English. hard_words = 0 disables the in-process long-sentence pass.

[sentences]
hard_words = 0
very_hard_words = 0
