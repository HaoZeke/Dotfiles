# Managed by chezmoi (dot_config/pipewire/pipewire.conf.d/10-rg-rt.conf)
#
# PipeWire module-rt is the daily-driver low-latency path for audio on linux-rg.
# Keep PREEMPT_RT out of the laptop kernel and give PipeWire bounded realtime
# priority through PAM limits, RTKit, or the realtime portal.
module.rt.args = {
    nice.level = -11
    rt.prio = 88
    rlimits.enabled = true
    rtkit.enabled = true
    rtportal.enabled = true
}
