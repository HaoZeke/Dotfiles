# Managed by chezmoi (dot_config/systemd/user/emacs.service.d/override.conf).
#
# Override the stock /usr/lib/systemd/user/emacs.service from the
# emacs package. Pin Doom's init-directory so a missing or stray
# ~/.emacs.d cannot start a vanilla daemon (user-dir=~/.emacs.d/,
# no doom-version, no private.el.gpg).
[Unit]
# Bound repeated failed starts before the service spends CPU in an init loop.
StartLimitIntervalSec=5min
StartLimitBurst=3

[Service]
# Clear the vendor ExecStart, then start Doom from $XDG_CONFIG_HOME/emacs.
ExecStart=
ExecStart=/usr/bin/emacs --fg-daemon --init-directory=%h/.config/emacs
Environment=EMACSDIR=%h/.config/emacs
Environment=DOOMDIR=%h/.config/doom

# First-boot startup runs Doom init plus any outstanding native-comp
# compilation. 90 s is generous but still catches a truly wedged
# init; extend if `doom sync` routinely exceeds it.
TimeoutStartSec=3min

# The daemon holds every open buffer, every unsaved change, every
# long-running process (magit, vterm, LSP, TRAMP). Lose this unit
# and you lose the state. Keep kernel OOM and systemd-oomd away.
OOMScoreAdjust=-500
ManagedOOMPreference=avoid

# Auto-restart on crash; back off so a loop does not thrash the log.
Restart=on-failure
RestartSec=5s
