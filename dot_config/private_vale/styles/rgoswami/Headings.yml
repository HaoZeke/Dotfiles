extends: capitalization
message: "'%s' should use sentence-style capitalization."
link: "https://developers.google.com/style/capitalization#capitalization-in-titles-and-headings"
level: warning
scope: heading
match: $sentence
indicators:
  - ":"
exceptions: # These are org-mode specific
  - (?:TODO|HOLD|CANCELLED|DECLINED|KILL|PROJ|INPROGRESS|DONE|RESCHEDULE|BLOCKED).*

# References
# [1]: https://github.com/cashpw/dotfiles/blob/main/config/vale/styles/cashpw/Headings.yml
